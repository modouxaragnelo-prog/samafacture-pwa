<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#133d3b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>SamaFacture</title>
<style>
:root{--ink:#18322f;--muted:#647771;--green:#17685b;--dark:#133d3b;--bg:#f4f7f5;--line:#e0e8e3;--white:#fff;--red:#a83838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:var(--dark);color:white;padding:calc(18px + env(safe-area-inset-top)) 22px 20px}header .bar{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#d4f4df;color:var(--dark);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:24px;font-weight:800}.brand b{font-size:21px;letter-spacing:-.6px}.sub{font-size:12px;color:#bbd6cf;margin-top:3px}main{max-width:1050px;margin:auto;padding:24px 18px 110px}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.8px}h2{font-size:19px}h3{font-size:15px}p{line-height:1.5}.muted{color:var(--muted);font-size:13px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--green);color:white;min-height:44px}.btn.secondary{background:#e6eee9;color:var(--dark)}.btn.light{background:white;color:var(--dark);border:1px solid var(--line)}.btn.danger{background:#fcebec;color:var(--red)}.btn.small{padding:9px 12px;font-size:13px;min-height:40px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #153d3b04}.stat{padding:15px 13px;margin:0;min-width:0}.stat strong{display:block;font-size:clamp(17px,4vw,27px);margin-top:10px;overflow-wrap:anywhere;letter-spacing:-.7px}.stat.accent{background:var(--dark);color:white;border-color:var(--dark)}.stat.accent .muted{color:#c7dfd8}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;gap:10px}.record{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record:first-child{padding-top:0}.record .name{font-weight:700;margin-bottom:5px}.record .amount{font-weight:750;text-align:right;white-space:nowrap}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f2eb;color:#246452;font-size:11px;font-weight:700;margin-top:6px}.tag.pending{background:#fff0d8;color:#8b5915}.tag.cancel{background:#f5e8e8;color:#9a4545}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{text-align:center;padding:25px 8px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:6px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:7px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}nav button{flex:1;max-width:180px;border:0;background:none;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;font-size:11px;font-weight:650}nav button.active{background:#e6f2eb;color:var(--green)}nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;min-width:0;border:1px solid #cfdcd4;border-radius:10px;background:#fff;padding:12px;color:var(--ink);font-size:16px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #17685b15}textarea{min-height:76px;resize:vertical}.field{margin-bottom:14px;min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.line-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fafcfb}.line-item .formgrid{grid-template-columns:1fr 1fr}.line-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.totals{margin-top:18px;background:#f3f7f4;padding:15px;border-radius:12px}.totalrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.grand{font-size:19px;font-weight:750;border-top:1px solid var(--line);margin-top:5px;padding-top:12px}.notice{background:#eaf3ec;border-radius:12px;padding:13px;font-size:13px;line-height:1.5;margin-bottom:14px}.notice.warn{background:#fff1da;color:#76531e}.search{margin-bottom:12px}.invoice{background:white;padding:28px;border:1px solid var(--line);border-radius:15px;color:#17302e}.invoice-top{display:flex;justify-content:space-between;gap:15px;border-bottom:2px solid #17685b;padding-bottom:18px;margin-bottom:22px}.invoice h1{font-size:27px;color:#17685b}.invoice .inv-id{text-align:right}.invoice .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.invoice table{width:100%;border-collapse:collapse;font-size:13px}.invoice th,.invoice td{text-align:right;padding:10px 5px;border-bottom:1px solid #e1e8e3;vertical-align:top}.invoice th:first-child,.invoice td:first-child{text-align:left;overflow-wrap:anywhere}.invoice th{background:#eaf3ec;color:#28574e}.invoice .totals{max-width:350px;margin-left:auto}.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 5px 25px #0003;max-width:90vw;text-align:center}.toast:empty{display:none}a{color:var(--green)}@media(max-width:500px){.stats{gap:7px}.stat{padding:12px 9px}.stat .muted{font-size:11px}.card{padding:15px}.invoice{padding:14px}.invoice .parties{gap:10px}.invoice h1{font-size:22px}.invoice table{font-size:11px}.invoice th,.invoice td{padding:8px 3px}.invoice .inv-id{font-size:12px}}@media print{@page{size:A4;margin:14mm}body{background:#fff}header,nav,.no-print,.toast{display:none!important}main{padding:0;max-width:none}.invoice{padding:0;border:0;border-radius:0}.invoice table{font-size:12px}.invoice tr{break-inside:avoid}.invoice thead{display:table-header-group}.invoice .totals{break-inside:avoid}.invoice *{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><header><div class="bar"><div class="brand"><div class="logo">S</div><div><b>SamaFacture</b><div class="sub">Commandes & facturation</div></div></div><span id="currencyTag" class="sub">CAD</span></div></header><main id="app"></main><nav id="nav" aria-label="Navigation"></nav><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='samafacture.v1';const blank=()=>({version:1,settings:{business:'',owner:'',email:'',phone:'',address:'',taxId:'',currency:'CAD',tax1Name:'Taxe 1',tax1:0,tax2Name:'Taxe 2',tax2:0,payment:'',footer:'Merci pour votre confiance !'},clients:[],orders:[],seq:0,invSeq:0});
let db=blank();let loadError=false;try{const raw=localStorage.getItem(KEY);if(raw)db=normalize(JSON.parse(raw))}catch(e){loadError=true}let page='home',draft=null,clientDraft=null,invoiceId=null,search='',statusFilter='all';
function normalize(x){if(!x||x.version!==1||!Array.isArray(x.clients)||!Array.isArray(x.orders)||!x.settings||!Number.isSafeInteger(x.seq)||!Number.isSafeInteger(x.invSeq))throw Error('Format invalide');return {...blank(),...x,settings:{...blank().settings,...x.settings}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Impossible de sauvegarder sur cet appareil. Exportez une sauvegarde dans Réglages.');return false}}
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const dateFmt=d=>{if(!d)return '—';const v=new Date(d+'T12:00:00');return isNaN(v)?esc(d):v.toLocaleDateString('fr-CA',{year:'numeric',month:'short',day:'numeric'})};const decimals=c=>c==='XOF'?0:2;const round=(v,c='CAD')=>Math.round((Number(v)+Number.EPSILON)*10**decimals(c))/10**decimals(c);const money=(v,c=db.settings.currency)=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:c,minimumFractionDigits:decimals(c),maximumFractionDigits:decimals(c)}).format(Number(v)||0);const num=v=>Math.max(0,Number(v)||0);const statusNames={pending:'En attente',confirmed:'Confirmée',delivered:'Livrée',cancelled:'Annulée'};const clientName=c=>c?.name||'Client sans nom';const pad=n=>String(n).padStart(5,'0');const clone=x=>JSON.parse(JSON.stringify(x));
function totals(o){const c=o.currency||'CAD',sub=round((o.items||[]).reduce((s,i)=>s+round(num(i.qty)*num(i.price),c),0),c),discount=round(Math.min(sub,num(o.discount)),c),base=round(sub-discount,c),tax1=round(base*num(o.tax1)/100,c),tax2=round(base*num(o.tax2)/100,c);return {sub,discount,base,tax1,tax2,total:round(base+tax1+tax2,c)}}
function toast(msg){$('toast').textContent=msg;setTimeout(()=>{if($('toast').textContent===msg)$('toast').textContent=''},3500)}
const icons={home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',orders:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',clients:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5"/>',invoices:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM9 8h6M9 12h6M9 16h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
function go(p){page=p;search='';statusFilter='all';render();window.scrollTo(0,0)}function render(){const active=page==='order'?'orders':page==='client'?'clients':page==='invoice'?'invoices':page;$('currencyTag').textContent=db.settings.currency;$('nav').innerHTML=[['home','Accueil'],['orders','Commandes'],['clients','Clients'],['invoices','Factures'],['settings','Réglages']].map(([p,t])=>`<button class="${active===p?'active':''}" onclick="go('${p}')"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[p]}</svg>${t}</button>`).join('');const screens={home,orders,clients,invoices,settings,order:orderForm,client:clientForm,invoice:invoiceView};$('app').innerHTML=screens[page]();if(page==='order')updateTotal()}
function title(t,sub,action=''){return `<div class="head no-print"><div><h1>${t}</h1><p class="muted">${sub}</p></div>${action}</div>`}const button=(text,call,kind='')=>`<button type="button" class="btn ${kind}" onclick="${call}">${text}</button>`;const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;
function home(){let all=db.orders.filter(o=>o.status!=='cancelled'),invs=db.orders.filter(o=>o.invoice),cur=db.settings.currency,same=invs.filter(o=>o.invoice.currency===cur),billed=same.reduce((s,o)=>s+totals(o.invoice).total,0),paid=same.filter(o=>o.paid).reduce((s,o)=>s+totals(o.invoice).total,0);return title('Tableau de bord','Gérez vos ventes en toute simplicité.')+(!db.settings.business?`<div class="notice">Commencez par renseigner vos coordonnées pour personnaliser vos factures. ${button('Configurer mon entreprise',"go('settings')",'small secondary')}</div>`:'')+`<div class="grid stats"><div class="card stat accent"><span class="muted">Total facturé · ${esc(cur)}</span><strong>${money(billed,cur)}</strong></div><div class="card stat"><span class="muted">À encaisser · ${esc(cur)}</span><strong>${money(billed-paid,cur)}</strong></div><div class="card stat"><span class="muted">Commandes actives</span><strong>${all.length}</strong></div></div><div class="grid">${button('+ Nouvelle commande','newOrder()')}${button('+ Nouveau client','newClient()','secondary')}</div><div class="section-title"><h2>Commandes récentes</h2>${button('Tout voir',"go('orders')",'small light')}</div><div class="card">${db.orders.length?db.orders.slice().reverse().slice(0,5).map(orderRecord).join(''):empty('Aucune commande','Votre première commande apparaîtra ici.')}</div><div class="section-title"><h2>Facturation</h2></div><div class="card"><div class="totalrow"><span>Factures créées</span><b>${invs.length}</b></div><div class="totalrow"><span>Factures payées</span><b>${invs.filter(o=>o.paid).length}</b></div><div class="totalrow"><span>Factures non payées</span><b>${invs.filter(o=>!o.paid).length}</b></div></div><p class="muted">Les montants du tableau de bord concernent uniquement la devise sélectionnée. Vos données sont conservées sur cet appareil.</p>`}
function orderRecord(o){return `<div class="record"><div style="min-width:0"><div class="name">${esc(o.number)} · ${esc(clientName(o.client))}</div><div class="muted">${dateFmt(o.date)} · ${o.items.length} article(s)</div><span class="tag ${o.status==='pending'?'pending':o.status==='cancelled'?'cancel':''}">${esc(statusNames[o.status]||o.status)}</span> ${o.invoice?'<span class="tag">Facturée</span>':''}</div><div><div class="amount">${money(totals(o).total,o.currency)}</div><div class="actions" style="justify-content:flex-end;margin-top:7px">${button('Ouvrir',`editOrder('${o.id}')`,'small light')}</div></div></div>`}
function orders(){return title('Commandes','Enregistrez et suivez vos ventes.',button('+ Nouvelle','newOrder()'))+`<div class="search"><input aria-label="Rechercher une commande" placeholder="Rechercher un client ou un numéro…" value="${esc(search)}" oninput="search=this.value;refreshOrders()"></div><div class="field"><select aria-label="Filtrer les commandes" onchange="statusFilter=this.value;refreshOrders()"><option value="all">Tous les statuts</option>${Object.entries(statusNames).map(([v,t])=>`<option value="${v}" ${statusFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="card" id="orderResults">${filteredOrders()}</div>`}function filteredOrders(){let q=search.toLowerCase();let a=db.orders.filter(o=>(statusFilter==='all'||o.status===statusFilter)&&`${o.number} ${clientName(o.client)}`.toLowerCase().includes(q)).slice().reverse();return a.length?a.map(orderRecord).join(''):empty('Aucune commande','Créez une commande ou modifiez votre recherche.')}function refreshOrders(){$('orderResults').innerHTML=filteredOrders()}
function clients(){return title('Clients','Retrouvez les coordonnées de vos clients.',button('+ Nouveau','newClient()'))+`<div class="search"><input aria-label="Rechercher un client" placeholder="Nom, téléphone ou courriel…" value="${esc(search)}" oninput="search=this.value;$('clientResults').innerHTML=filteredClients()"></div><div class="card" id="clientResults">${filteredClients()}</div>`}function filteredClients(){let q=search.toLowerCase(),a=db.clients.filter(c=>`${c.name} ${c.email} ${c.phone}`.toLowerCase().includes(q));return a.length?a.map(c=>`<div class="record"><div><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.email||c.phone||'Aucune coordonnée')}</div></div>${button('Modifier',`editClient('${c.id}')`,'small light')}</div>`).join(''):empty('Aucun client','Ajoutez vos premiers clients.')}
function field(label,key,value,type='text',extra=''){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" name="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`}function area(label,key,value){return `<div class="field full"><label for="${key}">${label}</label><textarea id="${key}" name="${key}">${esc(value)}</textarea></div>`}function formObj(f){return Object.fromEntries(new FormData(f).entries())}
function newClient(){clientDraft={id:null,name:'',email:'',phone:'',address:''};page='client';render();window.scrollTo(0,0)}function editClient(id){clientDraft=clone(db.clients.find(c=>c.id===id));page='client';render();window.scrollTo(0,0)}function clientForm(){let c=clientDraft;return title(c.id?'Modifier le client':'Nouveau client','Coordonnées à afficher sur les factures.',button('Retour',"go('clients')",'light'))+`<form class="card" onsubmit="saveClient(event)"><div class="formgrid">${field('Nom complet ou entreprise *','name',c.name,'text','required maxlength="160"')}${field('Téléphone','phone',c.phone,'tel')}${field('Courriel','email',c.email,'email')}${area('Adresse de facturation','address',c.address)}</div><div class="actions"><button class="btn" type="submit">Enregistrer</button>${c.id?button('Supprimer',`deleteClient('${c.id}')`,'danger'):''}</div></form>`}function saveClient(e){e.preventDefault();let c={...clientDraft,...formObj(e.target)};c.name=c.name.trim();if(!c.name)return alert('Le nom est obligatoire.');if(c.id)db.clients=db.clients.map(x=>x.id===c.id?c:x);else{c.id=uid();db.clients.push(c)}if(save()){go('clients');toast('Client enregistré.')}}function deleteClient(id){if(!confirm('Supprimer ce client du carnet ? Les commandes existantes conserveront leurs coordonnées.'))return;db.clients=db.clients.filter(c=>c.id!==id);if(save())go('clients')}
function newOrder(){let s=db.settings;draft={id:null,number:'',date:today(),due:'',status:'pending',client:{id:'',name:'',email:'',phone:'',address:''},items:[{description:'',qty:1,price:''}],currency:s.currency,tax1Name:s.tax1Name,tax1:s.tax1,tax2Name:s.tax2Name,tax2:s.tax2,discount:0,note:'',invoice:null,paid:false};page='order';render();window.scrollTo(0,0)}function editOrder(id){draft=clone(db.orders.find(o=>o.id===id));page='order';render();window.scrollTo(0,0)}function orderForm(){let d=draft,locked=!!d.invoice;return title(d.id?`Commande ${esc(d.number)}`:'Nouvelle commande','Articles, coordonnées et facturation.',button('Retour',"go('orders')",'light'))+(locked?`<div class="notice">Une facture a déjà été créée. Ses informations restent inchangées ; seul le statut de la commande peut être modifié ici. ${button('Voir la facture',`showInvoice('${d.id}')`,'small secondary')}</div>`:'')+`<form onsubmit="saveOrder(event)"><div class="card"><h2 style="margin-bottom:14px">Détails de la commande</h2><div class="formgrid">${field('Date','date',d.date,'date','required '+(locked?'disabled':''))}${field('Échéance de paiement','due',d.due,'date',locked?'disabled':'')}<div class="field"><label for="status">Statut</label><select id="status" name="status" onchange="draft.status=this.value">${Object.entries(statusNames).filter(([v])=>!locked||v!=='cancelled').map(([v,t])=>`<option value="${v}" ${v===d.status?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="currency">Devise</label><select id="currency" onchange="draft.currency=this.value;updateTotal()" ${locked?'disabled':''}>${currencies(d.currency)}</select></div></div></div><fieldset ${locked?'disabled':''} style="border:0;padding:0;margin:0;min-width:0"><div class="card"><h2 style="margin-bottom:14px">Informations du client</h2><div class="field"><label for="clientPick">Client enregistré</label><select id="clientPick" onchange="pickClient(this.value)"><option value="">Saisir manuellement</option>${db.clients.map(c=>`<option value="${c.id}" ${d.client.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="formgrid">${field('Nom ou entreprise *','cname',d.client.name,'text','required maxlength="160"')}${field('Téléphone','cphone',d.client.phone,'tel')}${field('Courriel','cemail',d.client.email,'email')}${area('Adresse','caddress',d.client.address)}</div>${!locked?'<label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="rememberClient" style="width:19px;height:19px"> Ajouter / mettre à jour dans le carnet clients</label>':''}</div><div class="card"><h2>Articles et services</h2><div id="items">${itemRows()}</div>${button('+ Ajouter un article','addItem()','secondary')}<div class="formgrid" style="margin-top:18px">${field('Remise (montant)','discount',d.discount,'number','min="0" step="any" oninput="draft.discount=this.value;updateTotal()"')}${field('Taxe 1 (%)','tax1',d.tax1,'number','min="0" max="100" step="any" oninput="draft.tax1=this.value;updateTotal()"')}${field('Taxe 2 (%)','tax2',d.tax2,'number','min="0" max="100" step="any" oninput="draft.tax2=this.value;updateTotal()"')}</div><div id="totals" class="totals"></div></div><div class="card">${area('Notes / instructions','note',d.note)}</div></fieldset><div class="actions"><button type="submit" class="btn">${locked?'Enregistrer le statut':'Enregistrer la commande'}</button>${d.id&&!locked?button('Créer la facture','issueFromForm()','secondary'):''}${d.id&&!locked?button('Supprimer',`deleteOrder('${d.id}')`,'danger'):''}</div>${!d.id?'<p class="muted" style="margin-top:12px">Enregistrez d’abord la commande pour pouvoir créer sa facture.</p>':''}</form>`}
function currencies(c){return ['CAD','XOF','USD','EUR'].map(x=>`<option ${c===x?'selected':''} value="${x}">${x}</option>`).join('')}
function itemRows(){return draft.items.map((i,n)=>`<div class="line-item"><div class="row"><h3>Article ${n+1}</h3>${button('Retirer',`removeItem(${n})`,'small danger')}</div><div class="field" style="margin-top:9px"><label for="desc${n}">Description *</label><input id="desc${n}" required maxlength="300" value="${esc(i.description)}" oninput="draft.items[${n}].description=this.value" placeholder="Produit ou service"></div><div class="formgrid">${field('Quantité',`qty${n}`,i.qty,'number',`required min="0.001" step="any" oninput="draft.items[${n}].qty=this.value;updateTotal()"`)}${field('Prix unitaire',`price${n}`,i.price,'number',`required min="0" step="any" oninput="draft.items[${n}].price=this.value;updateTotal()"`)}</div><div class="totalrow"><span class="muted">Montant</span><b id="lineTotal${n}"></b></div></div>`).join('')}
function pickClient(id){let c=db.clients.find(x=>x.id===id);draft.client=c?clone(c):{id:'',name:'',email:'',phone:'',address:''};for(const [key,val] of Object.entries({cname:draft.client.name,cphone:draft.client.phone,cemail:draft.client.email,caddress:draft.client.address}))$(key).value=val||''}
function addItem(){if(draft.invoice)return;draft.items.push({description:'',qty:1,price:''});$('items').innerHTML=itemRows();updateTotal()}function removeItem(n){if(draft.invoice)return;if(draft.items.length===1)return toast('Gardez au moins un article.');draft.items.splice(n,1);$('items').innerHTML=itemRows();updateTotal()}
function totalHTML(o){let t=totals(o),c=o.currency;return `<div class="totalrow"><span>Sous-total</span><span>${money(t.sub,c)}</span></div>${t.discount?`<div class="totalrow"><span>Remise</span><span>− ${money(t.discount,c)}</span></div>`:''}${num(o.tax1)?`<div class="totalrow"><span>${esc(o.tax1Name)} (${esc(o.tax1)} %)</span><span>${money(t.tax1,c)}</span></div>`:''}${num(o.tax2)?`<div class="totalrow"><span>${esc(o.tax2Name)} (${esc(o.tax2)} %)</span><span>${money(t.tax2,c)}</span></div>`:''}<div class="totalrow grand"><span>Total</span><span>${money(t.total,c)}</span></div>`}function updateTotal(){if(!$('totals'))return;$('totals').innerHTML=totalHTML(draft);draft.items.forEach((i,n)=>{$('lineTotal'+n).textContent=money(round(num(i.qty)*num(i.price),draft.currency),draft.currency)})}
function collectOrder(form){if(!form.reportValidity())return false;if(draft.invoice){draft.status=$('status').value;return true}draft.date=$('date').value;draft.due=$('due').value;draft.status=$('status').value;draft.client={id:$('clientPick').value,name:$('cname').value.trim(),email:$('cemail').value.trim(),phone:$('cphone').value.trim(),address:$('caddress').value.trim()};draft.note=$('note').value.trim();if(!draft.client.name||draft.items.some(i=>!i.description.trim()||!Number.isFinite(Number(i.qty))||Number(i.qty)<=0||i.price===''||!Number.isFinite(Number(i.price))||Number(i.price)<0))return alert('Vérifiez le nom du client, les articles, les quantités et les prix.'),false;if(draft.due&&draft.due<draft.date)return alert('L’échéance ne peut pas précéder la date de commande.'),false;draft.items=draft.items.map(i=>({description:i.description.trim(),qty:Number(i.qty),price:Number(i.price)}));draft.discount=num(draft.discount);draft.tax1=num(draft.tax1);draft.tax2=num(draft.tax2);if($('rememberClient').checked){if(draft.client.id)db.clients=db.clients.map(c=>c.id===draft.client.id?clone(draft.client):c);else{draft.client.id=uid();db.clients.push(clone(draft.client))}}return true}
function persistOrder(){if(!draft.id){draft.id=uid();draft.number='CMD-'+pad(++db.seq);db.orders.push(clone(draft))}else db.orders=db.orders.map(o=>o.id===draft.id?clone(draft):o);return save()}
function saveOrder(e){e.preventDefault();if(collectOrder(e.target)&&persistOrder()){toast('Commande enregistrée.');editOrder(draft.id)}}function deleteOrder(id){if(db.orders.find(o=>o.id===id)?.invoice)return;if(confirm('Supprimer définitivement cette commande ?')){db.orders=db.orders.filter(o=>o.id!==id);if(save())go('orders')}}
function issueFromForm(){let f=$('app').querySelector('form');if(!collectOrder(f))return;if(draft.status==='cancelled')return alert('Une commande annulée ne peut pas être facturée.');if(!db.settings.business.trim())return alert('Renseignez d’abord le nom de votre entreprise dans Réglages.');if(!confirm('Créer la facture ? Les coordonnées et les montants seront figés.'))return;let s=clone(db.settings),o=clone(draft);delete o.invoice;delete o.paid;o.number='FAC-'+pad(++db.invSeq);o.orderNumber=draft.number;o.issued=today();o.seller=s;draft.invoice=o;draft.paid=false;if(persistOrder()){showInvoice(draft.id);toast('Facture créée.')}}
function invoices(){let a=db.orders.filter(o=>o.invoice).slice().reverse();return title('Factures','Consultez, imprimez et suivez les paiements.')+`<div class="card">${a.length?a.map(o=>`<div class="record"><div><div class="name">${esc(o.invoice.number)} · ${esc(o.invoice.client.name)}</div><div class="muted">${dateFmt(o.invoice.issued)}</div><span class="tag ${o.paid?'':'pending'}">${o.paid?'Payée':'Non payée'}</span></div><div><div class="amount">${money(totals(o.invoice).total,o.invoice.currency)}</div><div class="actions" style="margin-top:7px;justify-content:flex-end">${button('Voir',`showInvoice('${o.id}')`,'small light')}</div></div></div>`).join(''):empty('Aucune facture','Créez une facture depuis une commande enregistrée.')}</div>`}
function showInvoice(id){invoiceId=id;page='invoice';render();window.scrollTo(0,0)}function invoiceView(){let o=db.orders.find(x=>x.id===invoiceId),i=o.invoice,s=i.seller,c=i.client;return title('Aperçu de facture','Imprimez ou enregistrez en PDF.',button('Retour',"go('invoices')",'light'))+`<div class="actions no-print" style="margin-bottom:16px">${button('Imprimer / PDF','window.print()')}${button(o.paid?'Marquer non payée':'Marquer payée',`togglePaid('${o.id}')`,'secondary')}</div><article class="invoice"><div class="invoice-top"><div><h1>FACTURE</h1><h3 style="margin-top:7px">${esc(s.business)}</h3></div><div class="inv-id"><b>${esc(i.number)}</b><p>Date : ${dateFmt(i.issued)}</p><p>Commande : ${esc(i.orderNumber)}</p>${i.due?`<p>Échéance : ${dateFmt(i.due)}</p>`:''}<span class="tag ${o.paid?'':'pending'}">${o.paid?'PAYÉE':'NON PAYÉE'}</span></div></div><div class="parties"><div><p class="muted">ÉMETTEUR</p><b>${esc(s.business)}</b><p class="pre">${esc([s.owner,s.address,s.phone,s.email,s.taxId].filter(Boolean).join('\n'))}</p></div><div><p class="muted">FACTURÉ À</p><b>${esc(c.name)}</b><p class="pre">${esc([c.address,c.phone,c.email].filter(Boolean).join('\n'))}</p></div></div><table><thead><tr><th>Description</th><th>Qté</th><th>Prix unit.</th><th>Montant</th></tr></thead><tbody>${i.items.map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.qty)}</td><td>${money(l.price,i.currency)}</td><td>${money(round(l.qty*l.price,i.currency),i.currency)}</td></tr>`).join('')}</tbody></table><div class="totals">${totalHTML(i)}<div class="muted" style="text-align:right">Devise : ${esc(i.currency)}</div></div>${i.note?`<div style="margin-top:22px"><h3>Notes</h3><p class="pre">${esc(i.note)}</p></div>`:''}${s.payment?`<div style="margin-top:18px"><h3>Modalités de paiement</h3><p class="pre">${esc(s.payment)}</p></div>`:''}<p class="pre" style="margin-top:26px;text-align:center;color:#647771">${esc(s.footer)}</p></article>`}function togglePaid(id){let o=db.orders.find(x=>x.id===id);o.paid=!o.paid;if(save()){render();toast('Statut de paiement mis à jour.')}}
function settings(){let s=db.settings;return title('Réglages','Personnalisez vos factures et sauvegardez vos données.')+`<form onsubmit="saveSettings(event)"><div class="card"><h2 style="margin-bottom:14px">Votre entreprise</h2><div class="formgrid">${field('Nom de l’entreprise *','business',s.business,'text','required')}${field('Votre nom','owner',s.owner)}${field('Courriel','email',s.email,'email')}${field('Téléphone','phone',s.phone,'tel')}${area('Adresse','address',s.address)}${area('Numéros fiscaux (si applicables)','taxId',s.taxId)}</div></div><div class="card"><h2 style="margin-bottom:14px">Facturation</h2><div class="field"><label for="currency">Devise par défaut</label><select name="currency" id="currency">${currencies(s.currency)}</select></div><div class="formgrid">${field('Nom de la taxe 1','tax1Name',s.tax1Name)}${field('Taux (%)','tax1',s.tax1,'number','min="0" max="100" step="any" required')}${field('Nom de la taxe 2','tax2Name',s.tax2Name)}${field('Taux (%)','tax2',s.tax2,'number','min="0" max="100" step="any" required')}${area('Modalités de paiement','payment',s.payment)}${area('Message de bas de facture','footer',s.footer)}</div><p class="muted">Les taxes sont à 0 % par défaut. Configurez uniquement les taxes qui s’appliquent à votre activité. Les deux taux sont calculés sur le montant après remise, indépendamment.</p></div><button type="submit" class="btn">Enregistrer les réglages</button></form><div class="card" style="margin-top:22px"><h2>Mes données</h2><p class="muted" style="margin-top:8px">Les données restent sur cet appareil. Exportez régulièrement un fichier de sauvegarde avant de changer d’appareil ou d’effacer Safari.</p><div class="actions">${button('Exporter la sauvegarde','exportData()','secondary')}${button('Importer une sauvegarde',"$('importFile').click()",'light')}</div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>`}
function saveSettings(e){e.preventDefault();let s=formObj(e.target);s.business=s.business.trim();if(!s.business)return alert('Indiquez un nom d’entreprise.');s.tax1=num(s.tax1);s.tax2=num(s.tax2);db.settings={...db.settings,...s};if(save()){render();toast('Réglages enregistrés.')}}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='SamaFacture-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function importData(file){if(!file)return;try{const x=normalize(JSON.parse(await file.text()));if(!validateImport(x))throw Error('invalid');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;db=x;if(save()){go('home');toast('Sauvegarde restaurée.')}}catch(e){alert('Fichier de sauvegarde invalide.')}}
function validateImport(x){let allowed=['CAD','XOF','USD','EUR'],idok=s=>typeof s==='string'&&/^[a-zA-Z0-9-]+$/.test(s),cok=c=>c&&typeof c.name==='string',ook=o=>o&&cok(o.client)&&allowed.includes(o.currency)&&Array.isArray(o.items)&&o.items.length&&o.items.every(i=>typeof i.description==='string'&&Number.isFinite(Number(i.qty))&&Number(i.qty)>0&&Number.isFinite(Number(i.price))&&Number(i.price)>=0);return typeof x.settings.business==='string'&&allowed.includes(x.settings.currency)&&x.seq>=0&&x.invSeq>=0&&x.clients.every(c=>cok(c)&&idok(c.id))&&x.orders.every(o=>ook(o)&&idok(o.id)&&typeof o.number==='string'&&Object.hasOwn(statusNames,o.status)&&(!o.invoice||(ook(o.invoice)&&o.invoice.seller&&typeof o.invoice.seller.business==='string')))}
render();if(loadError)alert('Les données sauvegardées n’ont pas pu être lues. Importez une sauvegarde si vous en avez une.');if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
